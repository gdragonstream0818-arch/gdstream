name: Update chart data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-chart-data
  cancel-in-progress: false

jobs:
  update-charts:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 차트 분석 도구 설치
        run: npm install

      - name: 음원 차트 데이터 갱신
        run: node scripts/update-charts.js

      - name: 변경된 차트 데이터 저장
        run: |
          git config user.name "gdstream chart bot"
          git config user.email "actions@github.com"

          git add chart-data.json

          if git diff --cached --quiet; then
            echo "차트 데이터 변경 사항이 없습니다."
          else
            git commit -m "Update chart data"
            git push
          fi

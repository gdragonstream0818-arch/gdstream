name: Test chart sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sources:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

            - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 차트 분석 도구 설치
        run: npm install

      - name: 차트 순위 추출 테스트
        run: node scripts/test-chart-sources.js


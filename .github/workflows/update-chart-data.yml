name: Update chart data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-chart-data
  cancel-in-progress: false

jobs:
  update-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Python 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 음원 차트 데이터 갱신
        run: python scripts/update_charts.py

      - name: 변경된 차트 데이터 저장
        run: |
          git config user.name "gdstream chart bot"
          git config user.email "actions@github.com"

          git add chart-data.json

          if git diff --cached --quiet; then
            echo "차트 데이터 변경 사항이 없습니다."
          else
            git commit -m "Update chart data"
            git push
          fi

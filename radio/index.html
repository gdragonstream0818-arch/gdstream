<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:type" content="website">
  <meta property="og:title" content="라디오 신청 | 지드래곤 음원총공팀">
  <meta property="og:description" content="현재 방송 중인 라디오에 빅뱅의 BiiiG을 신청하세요.">
  <meta property="og:url" content="https://www.gdstream.site/radio/">

  <title>라디오 신청 | 지드래곤 음원총공팀</title>

  <link rel="icon" href="/assets/meta/favicon.png" type="image/png" sizes="any">
  <link rel="stylesheet" href="/styles.css">

  <style>
    :root {
      --radio-blue: #315fc7;
      --radio-blue-dark: #173779;
      --radio-bg: #f5f7fb;
      --radio-line: rgba(0, 0, 0, .09);
      --radio-muted: rgba(0, 0, 0, .48);
    }

    body {
      background: var(--radio-bg);
    }

    .radioPage {
      min-height: calc(100vh - 100px);
      padding: 42px 0 64px;
    }

    .radioTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .radioBack {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #111;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }

    .radioBack:hover {
      opacity: .6;
    }

    .radioClock {
      color: var(--radio-muted);
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .radioIntro {
      margin-bottom: 22px;
    }

    .radioKicker {
      margin-bottom: 9px;
      color: var(--radio-blue);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .radioTitle {
      margin: 0;
      color: #111;
      font-size: clamp(30px, 7vw, 42px);
      font-weight: 900;
      letter-spacing: -.055em;
      line-height: 1.1;
    }

    .radioDescription {
      margin: 12px 0 0;
      color: var(--radio-muted);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.6;
    }

    .radioNowBox {
      margin: 26px 0 14px;
      padding: 15px 17px;
      border: 1px solid rgba(49, 95, 199, .16);
      border-radius: 16px;
      background: rgba(49, 95, 199, .07);
    }

    .radioNowLabel {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--radio-blue-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .radioLiveDot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e44a3b;
      box-shadow: 0 0 0 4px rgba(228, 74, 59, .12);
    }

    .radioNowText {
      margin: 8px 0 0;
      color: #111;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.45;
    }

    .radioGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
    }

    .radioCard {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 238px;
      padding: 20px;
      border: 1px solid var(--radio-line);
      border-radius: 18px;
      background: #fff;
      color: #111;
      text-align: left;
      font-family: inherit;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    button.radioCard {
      width: 100%;
      cursor: pointer;
    }

    .radioCard.is-active:hover {
      transform: translateY(-3px);
      border-color: rgba(49, 95, 199, .5);
      box-shadow: 0 14px 30px rgba(24, 51, 111, .14);
    }

    .radioCard.is-disabled {
      background: #f0f1f4;
      color: rgba(0, 0, 0, .35);
      cursor: not-allowed;
    }

    .radioStation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -.02em;
    }

    .radioLiveBadge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(49, 95, 199, .1);
      color: var(--radio-blue);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .radioLiveBadge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e44a3b;
    }

    .radioProgram {
      margin: auto 0 8px;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -.055em;
      line-height: 1.28;
      word-break: keep-all;
    }

    .radioCard.is-disabled .radioProgram {
      display: none;
    }

    .radioTime {
      color: var(--radio-muted);
      font-size: 13px;
      font-weight: 700;
    }

    .radioNumber {
      display: inline-flex;
      width: fit-content;
      margin-top: 17px;
      padding: 8px 10px;
      border-radius: 9px;
      background: #111;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .radioCard.is-disabled .radioNumber {
      display: none;
    }

    .radioAction {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 19px;
      padding-top: 15px;
      border-top: 1px solid var(--radio-line);
      color: var(--radio-blue);
      font-size: 13px;
      font-weight: 900;
    }

    .radioActionArrow {
      font-size: 18px;
      line-height: 1;
    }

    .radioCard.is-disabled .radioAction {
      margin-top: auto;
      color: rgba(0, 0, 0, .35);
    }

    .radioNotice {
      margin: 18px 0 0;
      color: var(--radio-muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.65;
    }

    @media (max-width: 720px) {
      .radioPage {
        padding-top: 28px;
      }

      .radioGrid {
        grid-template-columns: 1fr;
      }

      .radioCard {
        min-height: 180px;
      }

      .radioProgram {
        margin-top: 38px;
      }
    }
  </style>
</head>

<body>
  <header class="header header--simple">
    <div class="headerBar headerBar--center">
      <a class="brand" href="/" aria-label="지드래곤 음원총공팀 홈으로 이동">
        <img class="brandImg" src="/assets/header/logo.svg" alt="지드래곤 음원총공팀 로고">
      </a>
    </div>
  </header>

  <main class="container radioPage">
    <div class="radioTop">
      <a class="radioBack" href="/">
        <span aria-hidden="true">←</span>
        홈으로
      </a>

      <div id="radioClock" class="radioClock">한국 시간 확인 중</div>
    </div>

    <section class="radioIntro">
      <div class="radioKicker">G-DRAGON STREAM</div>
      <h1 class="radioTitle">라디오 신청</h1>
      <p class="radioDescription">
        현재 방송 중인 라디오를 선택하면 문자 작성 화면으로 이동합니다.<br>
        <strong>빅뱅의 BiiiG 신청합니다</strong> 문구가 자동으로 입력됩니다.
      </p>
    </section>

    <section class="radioNowBox" aria-live="polite">
      <div class="radioNowLabel">
        <span class="radioLiveDot"></span>
        현재 방송 중
      </div>
      <p id="radioNowText" class="radioNowText">현재 방송 정보를 확인하고 있습니다.</p>
    </section>

    <section id="radioGrid" class="radioGrid" aria-label="라디오 방송사 선택"></section>

    <p class="radioNotice">
      ※ 정규 편성표 기준으로 표시됩니다. 특집 방송·스포츠 중계·결방 등의 경우 실제 방송과 다를 수 있습니다.<br>
      ※ 문자 전송 시 방송사 정책 및 이용 중인 통신사 요금제가 적용될 수 있으며, 최종 전송은 문자 앱에서 직접 진행됩니다.
    </p>
  </main>

  <footer class="footer">
    <div class="container footerInner footerInner--logo">
      <a href="/" class="footerLogoLink" aria-label="지드래곤 음원총공팀 홈으로 이동">
        <img class="footerLogo" src="/assets/header/logo1.png" alt="지드래곤 음원총공팀 로고">
      </a>
    </div>
  </footer>

  <script>
    const SMS_MESSAGE = "빅뱅의 BiiiG 신청합니다";

    /*
      days 값:
      0 = 일요일 / 1 = 월요일 / 2 = 화요일 / 3 = 수요일
      4 = 목요일 / 5 = 금요일 / 6 = 토요일
    */
    const radioStations = [
      {
        station: "KBS",
        number: "#8910",
        schedule: [
          { start: "07:00", end: "09:00", title: "조정식의 FM 대행진", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "09:00", end: "11:00", title: "이현우의 음악앨범", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "11:00", end: "12:00", title: "박명수의 라디오쇼", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "12:00", end: "14:00", title: "폴킴의 가요광장", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "14:00", end: "16:00", title: "가비의 슈퍼라디오", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "16:00", end: "18:00", title: "윤정수 남창희의 미스터 라디오", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "18:00", end: "20:00", title: "사랑하기 좋은 날 이금희입니다", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "20:00", end: "22:00", title: "오마이걸 효정의 볼륨을 높여요", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "22:00", end: "24:00", title: "한해의 키스 더 라디오", days: [0, 1, 2, 3, 4, 5, 6] }
        ]
      },
      {
        station: "MBC",
        number: "#8000",
        schedule: [
          { start: "06:00", end: "07:00", title: "세상을 여는 아침 이영은입니다", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "07:00", end: "09:00", title: "굿모닝 FM 테이입니다", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "09:00", end: "11:00", title: "오늘 아침 윤상입니다", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "12:00", end: "14:00", title: "정오의 희망곡 김신영입니다", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "14:00", end: "16:00", title: "두시의 데이트 안영미입니다", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "16:00", end: "18:00", title: "완벽한 하루 이상순입니다", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "20:00", end: "22:00", title: "김이나의 별이 빛나는 밤에", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "22:00", end: "24:00", title: "친한친구 방송반", days: [1, 2, 3] },
          { start: "22:00", end: "24:00", title: "아이돌 라디오", days: [4, 5] },
          { start: "22:00", end: "24:00", title: "스포왕 고영배", days: [0, 6] }
        ]
      },
      {
        station: "SBS",
        number: "#1077",
        schedule: [
          { start: "07:00", end: "09:00", title: "김영철의 파워FM", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "09:00", end: "11:00", title: "아름다운 이 아침, 봉태규입니다", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "12:00", end: "14:00", title: "12시엔 주현영", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "14:00", end: "16:00", title: "두시탈출 컬투쇼", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "16:00", end: "18:00", title: "황제성의 황제파워", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "18:00", end: "20:00", title: "박소현의 러브게임", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "20:00", end: "22:00", title: "웬디의 영스트리트", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "22:00", end: "23:00", title: "배성재의 밤", days: [0, 1, 2, 3, 4, 5, 6] },
          { start: "23:00", end: "01:00", title: "딘딘의 뮤직하이", days: [0, 1, 2, 3, 4, 5, 6] }
        ]
      }
    ];

    function getKoreanNow() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Seoul",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const getPart = (type) => parts.find(part => part.type === type)?.value;

      const weekdayMap = {
        Sun: 0,
        Mon: 1,
        Tue: 2,
        Wed: 3,
        Thu: 4,
        Fri: 5,
        Sat: 6
      };

      return {
        weekday: weekdayMap[getPart("weekday")],
        hour: Number(getPart("hour")),
        minute: Number(getPart("minute"))
      };
    }

    function toMinutes(time) {
      const [hour, minute] = time.split(":").map(Number);
      return hour * 60 + minute;
    }

    function isOnAir(program, now) {
      const currentTime = now.hour * 60 + now.minute;
      const startTime = toMinutes(program.start);
      const endTime = toMinutes(program.end);

      const isCorrectDay = program.days.includes(now.weekday);

      if (!isCorrectDay) {
        return false;
      }

      if (endTime <= startTime) {
        return currentTime >= startTime || currentTime < endTime;
      }

      return currentTime >= startTime && currentTime < endTime;
    }

    function getCurrentProgram(station, now) {
      return station.schedule.find(program => isOnAir(program, now)) || null;
    }

    function formatKoreanClock() {
      return new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        weekday: "long",
        hour: "numeric",
        minute: "2-digit",
        hour12: false
      }).format(new Date());
    }

    function sendSms(number) {
      const smsUrl = `sms:${encodeURIComponent(number)}?body=${encodeURIComponent(SMS_MESSAGE)}`;
      window.location.href = smsUrl;
    }

    function renderRadioPage() {
      const now = getKoreanNow();
      const grid = document.getElementById("radioGrid");
      const clock = document.getElementById("radioClock");
      const nowText = document.getElementById("radioNowText");

      clock.textContent = `한국 시간 · ${formatKoreanClock()}`;

      const activePrograms = [];

      grid.innerHTML = radioStations.map(station => {
        const currentProgram = getCurrentProgram(station, now);

        if (currentProgram) {
          activePrograms.push(`${station.station} ${currentProgram.title}`);

          return `
            <button
              type="button"
              class="radioCard is-active"
              onclick="sendSms('${station.number}')"
              aria-label="${station.station} ${currentProgram.title}에 문자 신청하기"
            >
              <div class="radioStation">
                <span>${station.station}</span>
                <span class="radioLiveBadge">ON AIR</span>
              </div>

              <div class="radioProgram">${currentProgram.title}</div>
              <div class="radioTime">${currentProgram.start} ~ ${currentProgram.end}</div>
              <div class="radioNumber">${station.number}</div>

              <div class="radioAction">
                <span>문자로 BiiiG 신청하기</span>
                <span class="radioActionArrow">→</span>
              </div>
            </button>
          `;
        }

        return `
          <button
            type="button"
            class="radioCard is-disabled"
            disabled
            aria-label="${station.station} 현재 진행 중인 프로그램 없음"
          >
            <div class="radioStation">
              <span>${station.station}</span>
            </div>

            <div class="radioAction">
              <span>현재 진행 중인 프로그램이 없습니다</span>
            </div>
          </button>
        `;
      }).join("");

      if (activePrograms.length === 0) {
        nowText.textContent = "현재 등록된 정규 편성 프로그램이 없습니다.";
      } else {
        nowText.textContent = activePrograms.join(" · ");
      }
    }

    renderRadioPage();
    setInterval(renderRadioPage, 60 * 1000);
  </script>
</body>
</html>

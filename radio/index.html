<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>라디오 신청 | 지드래곤 음원총공팀</title>

<link rel="stylesheet" href="/styles.css">

<style>

body {
  background:#fff;
}

.radioPage{
  padding:25px 0 0;
}

.radioClock{
  text-align:right;
  color:rgba(0,0,0,.4);
  font-size:12px;
  margin-bottom:18px;
}

/* 소개 */
.radioIntro{
  margin-bottom:16px;
}

.radioTitle{
  margin:0;
  font-size:34px;
  font-weight:950;
  letter-spacing:-.05em;
}

.radioDescription{
  margin-top:10px;
  color:rgba(0,0,0,.55);
  font-size:13px;
  line-height:1.6;
}


/* 방송 카드 */
.radioGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}


.radioCard{
  display:flex;
  flex-direction:column;
  min-height:115px;
  padding:13px;
  border-radius:16px;
  border:1px solid rgba(0,0,0,.08);
  background:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.04);
  cursor:pointer;
  text-align:left;
}


.radioStation{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  font-weight:900;
}


.radioLiveBadge{
  padding:3px 7px;
  border-radius:20px;
  background:#111;
  color:white;
  font-size:8px;
}


.radioLiveBadge::before{
  content:"";
  display:inline-block;
  width:5px;
  height:5px;
  background:#ff4444;
  border-radius:50%;
  margin-right:4px;
}


.radioProgram{
  margin-top:auto;
  font-size:17px;
  font-weight:900;
  letter-spacing:-.04em;
}


.radioTime{
  margin-top:5px;
  color:rgba(0,0,0,.45);
  font-size:11px;
}


.radioNumber{
  margin-top:6px;
  font-size:11px;
  color:rgba(0,0,0,.55);
}


/* 모바일 */
@media(max-width:720px){

.radioGrid{
 grid-template-columns:1fr;
}

.radioTitle{
 font-size:30px;
}

.radioCard{
 min-height:95px;
}

}


</style>

</head>


<body>


<main class="container radioPage">


<div id="radioClock" class="radioClock">
한국 시간 확인 중
</div>


<section class="radioIntro">

<h1 class="radioTitle">
라디오 신청
</h1>


<p class="radioDescription">

라디오는 음악방송 방송점수에 큰 도움이 됩니다.<br>

KBS 뮤직뱅크 20% · MBC 뮤직뱅크 10% · SBS 인기가요 10% 반영

<br><br>

방송 프로그램 성격에 맞는 사연과 함께 신청해주세요!

</p>


</section>



<section id="radioGrid" class="radioGrid"></section>



</main>



<script>


const SMS_MESSAGE =
"빅뱅의 BiiiG 신청합니다";



const radioStations=[


{
station:"KBS",
number:"#8910",
program:"KBS 라디오",
time:"현재 방송 신청"
},


{
station:"MBC",
number:"#8000",
program:"MBC 라디오",
time:"현재 방송 신청"
},


{
station:"SBS",
number:"#1077",
program:"SBS 라디오",
time:"현재 방송 신청"
}


];



function sendSms(number){

location.href =
`sms:${encodeURIComponent(number)}?body=${encodeURIComponent(SMS_MESSAGE)}`;

}



function renderRadio(){


const grid=document.getElementById("radioGrid");


grid.innerHTML=
radioStations.map(r=>`

<button class="radioCard"
onclick="sendSms('${r.number}')">


<div class="radioStation">

<span>${r.station}</span>

<span class="radioLiveBadge">
ON AIR
</span>

</div>


<div class="radioProgram">
${r.program}
</div>


<div class="radioTime">
${r.time}
</div>


<div class="radioNumber">
${r.number}
</div>


</button>


`).join("");

}



function clock(){

document.getElementById("radioClock").innerHTML=
"한국 시간 · "+
new Intl.DateTimeFormat(
"ko-KR",
{
timeZone:"Asia/Seoul",
hour:"2-digit",
minute:"2-digit",
hour12:false
}
).format(new Date());

}



renderRadio();

clock();

setInterval(clock,60000);



</script>


</body>
</html>

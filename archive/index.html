<style>


/* =========================
   ARCHIVE PAGE
   ========================= */


.archivePage {

  min-height:calc(100vh - 100px);

  padding:28px 0 58px;

}





/* =========================
   INTRO CARD
   ========================= */


.archiveIntro {

  margin-bottom:18px;

  padding:22px 22px 20px;

  border:1px solid rgba(0,0,0,.055);

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      rgba(190,205,235,.32),
      rgba(245,195,190,.24)
    );

  box-shadow:
    0 10px 28px rgba(0,0,0,.055);

}



.archiveTitle {

  margin:0;

  color:#111;

  font-size:clamp(29px,6vw,40px);

  font-weight:950;

  letter-spacing:-.055em;

  line-height:1.06;

}



.archiveDescription {

  margin:11px 0 0;

  color:rgba(0,0,0,.54);

  font-size:13px;

  font-weight:650;

  line-height:1.6;

  letter-spacing:-.03em;

}





/* =========================
   GRID
   ========================= */


.archiveGrid {

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:18px 12px;

}




.archiveCard {

  color:#111;

  text-decoration:none;

}



.archiveCover {

  overflow:hidden;

  aspect-ratio:3 / 4;

  border-radius:18px;

  background:#f4f4f4;

  border:1px solid rgba(0,0,0,.06);

}



.archiveCover img {

  display:block;

  width:100%;

  height:100%;

  object-fit:cover;

  transition:.2s ease;

}



.archiveCard:hover .archiveCover img {

  transform:scale(1.03);

}




.archiveMeta {

  padding:9px 3px 0;

}



.archiveName {

  color:#111;

  font-size:15px;

  font-weight:900;

  letter-spacing:-.04em;

  line-height:1.3;

}



.archiveNo {

  margin-top:4px;

  color:rgba(0,0,0,.36);

  font-size:10px;

  font-weight:800;

}





/* =========================
   MOBILE
   ========================= */


@media(max-width:720px){


.archivePage {

  padding-top:20px;

}



.archiveIntro {

  padding:19px 17px 18px;

  border-radius:19px;

}



.archiveTitle {

  font-size:30px;

}



.archiveDescription {

  font-size:12px;

}



.archiveGrid {

  grid-template-columns:repeat(2,1fr);

  gap:14px 10px;

}



.archiveCover {

  border-radius:14px;

}



.archiveName {

  font-size:14px;

}


}


</style>

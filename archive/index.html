  <link rel="stylesheet" href="/styles.css">


  <style>

    /* =========================
       ARCHIVE OVERVIEW
       ========================= */

    .archiveOverview {
      margin: 20px 0 0;
    }


    /* 상단 소개 */

    .archiveOverviewHead {
      margin-bottom: 24px;
      padding: 8px 2px 22px;
      border-bottom: 1px solid rgba(0, 0, 0, .08);
    }


    .archiveOverviewTitle {
      margin: 0;
      color: #111;
      font-size: clamp(26px, 4vw, 32px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -.045em;
    }


    .archiveOverviewDesc {
      margin: 10px 0 0;
      max-width: 560px;
      color: rgba(0, 0, 0, .52);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.65;
      letter-spacing: -.025em;
    }



    /* =========================
       2 COLUMN GRID
       ========================= */

    .archiveOverviewGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px 16px;
    }


    .archiveOverviewCard {
      display: block;
      min-width: 0;
      color: #111;
      text-decoration: none;
    }


    .archiveOverviewCover {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 4;

      border: 1px solid rgba(0, 0, 0, .065);
      border-radius: 18px;

      background: #f3f4f6;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, .07);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }


    .archiveOverviewCover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;

      transition:
        transform .25s ease,
        filter .25s ease;
    }


    .archiveOverviewCard:hover .archiveOverviewCover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 26px rgba(0, 0, 0, .10);
    }


    .archiveOverviewCard:hover .archiveOverviewCover img {
      transform: scale(1.025);
    }



    /* 카드 하단 정보 */

    .archiveOverviewMeta {
      padding: 10px 3px 0;
    }


    .archiveOverviewNo {
      margin-bottom: 4px;
      color: rgba(0, 0, 0, .36);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .04em;
    }


    .archiveOverviewName {
      overflow: hidden;
      color: #111;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: -.04em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }



    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

      .archiveOverview {
        margin-top: 18px;
      }


      .archiveOverviewHead {
        margin-bottom: 20px;
        padding: 6px 1px 18px;
      }


      .archiveOverviewTitle {
        font-size: 26px;
      }


      .archiveOverviewDesc {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.6;
      }


      .archiveOverviewGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 10px;
      }


      .archiveOverviewCover {
        border-radius: 15px;
        box-shadow:
          0 7px 16px rgba(0, 0, 0, .065);
      }


      .archiveOverviewMeta {
        padding-top: 8px;
      }


      .archiveOverviewName {
        font-size: 15px;
      }


      .archiveOverviewNo {
        font-size: 9px;
      }

    }


    @media (max-width: 420px) {

      .archiveOverviewGrid {
        gap: 18px 9px;
      }


      .archiveOverviewCover {
        border-radius: 14px;
      }


      .archiveOverviewName {
        font-size: 14px;
      }

    }

  </style>

</head>

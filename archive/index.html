  <link rel="stylesheet" href="/styles.css">
  <style>
    .subPage { padding-top:18px; padding-bottom:42px; }
    .subTopBar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .subBack { color:rgba(0,0,0,.55); font-size:13px; font-weight:800; text-decoration:none; }
    .subBack:hover { color:#111; }
    .subTitle { margin:0; color:#111; font-size:clamp(24px,5vw,34px); font-weight:950; letter-spacing:-.055em; }
    .subDesc { margin:7px 0 0; color:rgba(0,0,0,.48); font-size:12px; font-weight:700; line-height:1.6; }
    @media (max-width:520px) {
      .subPage { padding-top:12px; }
    }
  
    .archiveAllGrid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .archiveAllCard { display:block; overflow:hidden; border:1px solid rgba(0,0,0,.08); border-radius:16px; background:#fff; color:#111; text-decoration:none; box-shadow:0 10px 28px rgba(0,0,0,.04); }
    .archiveAllImgBox { aspect-ratio:3/4; overflow:hidden; background:#f2f3f5; }
    .archiveAllImgBox img { width:100%; height:100%; object-fit:cover; transition:transform .2s ease; }
    .archiveAllCard:hover .archiveAllImgBox img { transform:scale(1.025); }
    .archiveAllBody { padding:12px 13px 13px; }
    .archiveAllTitle { color:#111; font-size:14px; font-weight:900; letter-spacing:-.03em; }
    .archiveAllTag { margin-top:4px; color:rgba(0,0,0,.38); font-size:10px; font-weight:800; }
    @media (max-width:700px) { .archiveAllGrid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } }
  </style>
</head>

  <header class="header header--simple"><div class="headerBar headerBar--center"><a class="brand" href="/" aria-label="지드래곤 음원총공팀"><img class="brandImg" src="/assets/header/logo.svg" alt="지드래곤 음원총공팀 로고"></a></div></header>

    <section class="archiveAllGrid">
      <a class="archiveAllCard" href="/archive/archiving/jacob-co/"><div class="archiveAllImgBox"><img src="/assets/archive/archive1.jpg" alt="제이콥앤코"></div><div class="archiveAllBody"><div class="archiveAllTitle">JACOB&amp;CO</div><div class="archiveAllTag">#1</div></div></a>
      <a class="archiveAllCard" href="/archive/archiving/yellowcoin/"><div class="archiveAllImgBox"><img src="/assets/archive/archive2.jpg" alt="노란동전"></div><div class="archiveAllBody"><div class="archiveAllTitle">노란 동전 자선 행사</div><div class="archiveAllTag">#2</div></div></a>
      <a class="archiveAllCard" href="/archive/archiving/fanplusone/"><div class="archiveAllImgBox"><img src="/assets/archive/archive3.jpg" alt="FANPLUSONE"></div><div class="archiveAllBody"><div class="archiveAllTitle">FANPLUSONE</div><div class="archiveAllTag">#3</div></div></a>
      <a class="archiveAllCard" href="/archive/archiving/exhibition/"><div class="archiveAllImgBox"><img src="/assets/archive/archive4.jpg" alt="EXHIBITION"></div><div class="archiveAllBody"><div class="archiveAllTitle">EXHIBITION</div><div class="archiveAllTag">#4</div></div></a>
      <a class="archiveAllCard" href="/archive/archiving/goodday/"><div class="archiveAllImgBox"><img src="/assets/archive/archive5.jpg" alt="굿데이"></div><div class="archiveAllBody"><div class="archiveAllTitle">굿데이</div><div class="archiveAllTag">#5</div></div></a>
      <a class="archiveAllCard" href="/archive/archiving/nike/"><div class="archiveAllImgBox"><img src="/assets/archive/archive6.jpg" alt="나이키"></div><div class="archiveAllBody"><div class="archiveAllTitle">NIKE</div><div class="archiveAllTag">#6</div></div></a>
    </section>
  </main>

  <footer class="footer"><div class="container footerInner footerInner--logo"><a href="/" class="footerLogoLink" aria-label="지드래곤 음원총공팀 홈으로 이동"><img class="footerLogo" src="/assets/header/logo1.png" alt="지드래곤 음원총공팀 로고"></a></div></footer>

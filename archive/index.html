  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">

  <meta name="twitter:description" content="G-DRAGON 관련 아카이빙 콘텐츠를 모아봅니다.">
  <meta name="twitter:image" content="https://i.ibb.co/JgfVvDn/ogw.png">

  <title>아카이빙 | 지드래곤 음원총공팀</title>

  <link rel="stylesheet" href="/styles.css">

  <style>

    .archiveSection {
      margin-top: 20px;
      margin-bottom: 18px;
    }

    .archiveHead {
      margin-bottom: 14px;
    }

    .archiveTitle {
      margin: 0;
      color: #111;
      font-size: clamp(24px, 5vw, 30px);
      font-weight: 900;
      letter-spacing: -.055em;
      line-height: 1.1;
    }

    .archiveGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px 12px;
    }

    .archiveCard {
      min-width: 0;
      color: #111;
      text-decoration: none;
    }

    .archiveCover {
      position: relative;
      overflow: hidden;
      aspect-ratio: 3 / 4;
      border: 1px solid rgba(0,0,0,.07);
      border-radius: 14px;
      background: #f3f4f6;
    }

    .archiveCover img {
      display: block;
      width:100%;
      height:100%;
      object-fit:cover;
      transition:transform .2s ease;
    }

    .archiveCard:hover .archiveCover img {
      transform:scale(1.018);
    }


    .archiveMeta {
      padding:8px 2px 0;
    }


    /* 제목 크기 확대 */
    .archiveName {
      overflow:hidden;
      color:#111;
      font-size:16px;
      font-weight:900;
      letter-spacing:-.035em;
      line-height:1.3;
      text-overflow:ellipsis;
      white-space:nowrap;
    }


    .archiveNo {
      margin-top:3px;
      color:rgba(0,0,0,.34);
      font-size:10px;
      font-weight:800;
      line-height:1;
    }


    .footer {
      margin-top:0!important;
    }

    .footerInner {
      padding-top:18px!important;
      padding-bottom:18px!important;
    }


    @media(max-width:700px){

      .archiveGrid {
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px 10px;
      }

      .archiveMeta {
        padding-top:7px;
      }

      .archiveName {
        font-size:15px;
      }

    }


    @media(max-width:370px){

      .archiveGrid {
        gap:10px 8px;
      }

      .archiveCover {
        border-radius:12px;
      }

    }

  </style>

</head>

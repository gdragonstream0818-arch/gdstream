<style>


/* =========================
   ARCHIVE MAIN
   ========================= */


.archivePage {

  padding-top:34px;

  padding-bottom:70px;

}




/* =========================
   HERO
   ========================= */


.archiveHero {

  margin-bottom:38px;

  padding:24px 22px;

  border-radius:22px;

  background:
  linear-gradient(
    135deg,
    rgba(190,205,235,.35),
    rgba(245,195,190,.35)
  );

  box-shadow:
  0 10px 28px rgba(0,0,0,.08);

}



.archiveLabel {

  margin-bottom:12px;

  color:rgba(0,0,0,.45);

  font-size:11px;

  font-weight:900;

  letter-spacing:.12em;

}



.archiveTitle {

  margin:0;

  color:#111;

  font-size:
  clamp(30px,6vw,42px);

  font-weight:950;

  line-height:1.08;

  letter-spacing:-.06em;

}



.archiveIntro {

  margin:14px 0 0;

  color:rgba(0,0,0,.55);

  font-size:14px;

  font-weight:700;

  line-height:1.7;

  letter-spacing:-.03em;

}





/* =========================
   GRID
   ========================= */


.archiveGrid {

  display:grid;

  grid-template-columns:
  repeat(3,minmax(0,1fr));

  gap:20px 14px;

}




.archiveCard {

  color:#111;

  text-decoration:none;

}




.archiveCover {

  position:relative;

  overflow:hidden;

  aspect-ratio:3 / 4;

  border-radius:16px;

  background:#f3f3f3;

}



.archiveCover img {

  display:block;

  width:100%;

  height:100%;

  object-fit:cover;

  transition:
  transform .25s ease;

}



.archiveCard:hover .archiveCover img {

  transform:scale(1.03);

}




.archiveMeta {

  padding:10px 3px 0;

}



.archiveName {

  color:#111;

  font-size:15px;

  font-weight:900;

  line-height:1.3;

  letter-spacing:-.04em;

}



.archiveNo {

  margin-top:4px;

  color:rgba(0,0,0,.35);

  font-size:11px;

  font-weight:800;

}





/* =========================
   MOBILE
   ========================= */


@media(max-width:700px){


.archivePage {

  padding-top:26px;

  padding-bottom:55px;

}



.archiveHero {

  padding:20px 18px;

  border-radius:18px;

}



.archiveTitle {

  font-size:30px;

}



.archiveIntro {

  font-size:13px;

}



.archiveGrid {

  grid-template-columns:
  repeat(2,minmax(0,1fr));

  gap:16px 10px;

}



.archiveCover {

  border-radius:13px;

}



.archiveName {

  font-size:14px;

}


}




</style>
